version: '3.8'

# CRITICAL = 50
# FATAL = CRITICAL
# ERROR = 40
# WARNING = 30
# WARN = WARNING
# INFO = 20
# DEBUG = 10
# NOTSET = 0

# what to do with failure streams???
# you inspect them manually
# fix bugs that caused them
# then create a replay service and deploy it here
# replay service will fix the message formats and process them, then publish to correct stream to reintegrate

x-common-env: &common-env
  env_file:
    - ${ENV_FILE_PATH}

x-prioritiser-service: &prioritiser-service
  image: sentinel/job-prioritiser:latest
  build:
    context: ../../
    dockerfile: ./microservices/job_prioritiser/Dockerfile
  depends_on:
    - redis
  restart: unless-stopped
  networks:
    - sentinel-net

services:
  # --- INFRASTRUCTURE ---
  redis:
    container_name: sentinel-redis-container
    image: "redis:alpine"
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - ${HOST_ROOT}/data/redis_data:/data
    restart: unless-stopped
    networks:
      - sentinel-net
    command: >
      redis-server --appendonly no --appendfsync everysec --save 60 1 --timeout 300 --tcp-keepalive 60 --dbfilename "dump.rdb" --dir /data

    <<: *common-env
    deploy:
      resources:
        limits:
          cpus: '${REDIS_CPU_LIMIT:-0.5}'
          memory: '${REDIS_MEMORY_LIMIT:-512M}'
        reservations:
          cpus: '${REDIS_CPU_RESERVATION:-0.25}'
          memory: '${REDIS_MEMORY_RESERVATION:-256M}'

  postgres:
    container_name: sentinel-postgres-container
    image: pgvector/pgvector:pg15
    ports:
      - ${POSTGRES_PORT}:5432
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_HOST_AUTH_METHOD: ${POSTGRES_HOST_AUTH_METHOD:-md5}

    volumes:
      - ${HOST_ROOT}/data/postgres_data:/var/lib/postgresql/data
      - ${HOST_ROOT}/microservices/db/init.sql:/docker-entrypoint-initdb.d/init.sql

    <<: *common-env
    restart: unless-stopped
    networks:
      - sentinel-net

    command: postgres -c shared_preload_libraries=vector
    deploy:
      resources:
        limits:
          cpus: '${POSTGRES_CPU_LIMIT:-1.0}'
          memory: '${POSTGRES_MEMORY_LIMIT:-2G}'
        reservations:
          cpus: '${POSTGRES_CPU_RESERVATION:-0.5}'
          memory: '${POSTGRES_MEMORY_RESERVATION:-1G}'

  # --- MICROSERVICES ---
  api-service:
    container_name: sentinel-api-service-container
    image: sentinel/api-service:latest
    build:
      context: ../../
      dockerfile: ./microservices/api/Dockerfile

    depends_on:
      - postgres
      - redis

    profiles:
      - api
      # volumes:
      # Note: On Docker Desktop for Mac, uncomment below and add /workspaces to Docker -> Preferences -> Resources -> File Sharing
      # - ${HOST_LOG_ROOT}/api:/app/logs

    ports:
      - ${API_SERVICE_PORT:-8001}:8001

    restart: unless-stopped
    networks:
      - sentinel-net

    <<: *common-env
    environment:
      - API_SERVICE_PORT=${API_SERVICE_PORT:-8001}
      - POSTGRES_PORT=${POSTGRES_PORT:-5432}
      - POSTGRES_DB=${POSTGRES_DB:-sentinel}
      - POSTGRES_USER=${POSTGRES_USER:-sentinel}
      - POSTGRES_HOST=${POSTGRES_HOST:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-sentinelpass}
      - OUTPUT_STREAM=${API_OUTPUT_STREAM:-user:to.be.scraped}
      - WARNING_NOTIFICATION_STREAM=${WARNING_NOTIFICATION_STREAM:-sentinel_warning_alerts}
      - CRITICAL_NOTIFICATION_STREAM=${CRITICAL_NOTIFICATION_STREAM:-sentinel_critical_alerts}

    deploy:
      resources:
        limits:
          cpus: '${API_CPU_LIMIT:-0.5}'
          memory: '${API_MEMORY_LIMIT:-512M}'
        reservations:
          cpus: '${API_CPU_RESERVATION:-0.25}'
          memory: '${API_MEMORY_RESERVATION:-256M}'

  ingestor-service:
    container_name: sentinel-ingestor-service-container
    image: sentinel/ingestor-service:latest
    build:
      context: ../../
      dockerfile: ./microservices/ingestor/Dockerfile

    depends_on:
      - postgres
      - redis

    volumes:
      - ${HOST_LOG_ROOT}/ingestor:/app/logs

    profiles:
      - ingestor

    restart: unless-stopped
    networks:
      - sentinel-net

    <<: *common-env
    environment:
      - REDIS_DUPLICATE_FILTER_KEY=${INGESTOR_REDIS_DUPLICATE_FILTER_KEY:-ingestor:seen.articles}
      - OUTPUT_STREAM=${INGESTOR_OUTPUT_STREAM:-background:to.be.scraped}
      - WARNING_NOTIFICATION_STREAM=${WARNING_NOTIFICATION_STREAM:-sentinel_warning_alerts}
      - CRITICAL_NOTIFICATION_STREAM=${CRITICAL_NOTIFICATION_STREAM:-sentinel_critical_alerts}
      # performance tuning 
      - MAX_INGESTOR_WORKERS=${INGESTOR_MAX_WORKERS:-10}

    deploy:
      resources:
        limits:
          cpus: '${INGESTOR_CPU_LIMIT:-0.5}'
          memory: '${INGESTOR_MEMORY_LIMIT:-512M}'
        reservations:
          cpus: '${INGESTOR_CPU_RESERVATION:-0.25}'
          memory: '${INGESTOR_MEMORY_RESERVATION:-256M}'

  web_scraper-service:
    container_name: sentinel-web-scraper-service-container
    image: sentinel/web-scraper-service:latest
    build:
      context: ../../
      dockerfile: ./microservices/web_scraper/Dockerfile
    shm_size: '${WEB_SCRAPER_SHM_SIZE:-4gb}'
    ipc: host

    depends_on:
      - postgres
      - redis

    profiles:
      - scraper

    volumes:
      - ${HOST_LOG_ROOT}/scraper/logs:/app/logs
      - ${HOST_LOG_ROOT}/scraper/screenshots:/app/screenshots

    restart: unless-stopped
    networks:
      - sentinel-net

    <<: *common-env
    environment:

      - INPUT_STREAMS=${WEB_SCRAPER_INPUT_STREAMS:-user:to.be.scraped, background:to.be.scraped}
      - USER_OUTPUT_STREAM=${WEB_SCRAPER_USER_OUTPUT_STREAM:-user:to.be.nlp}
      - BACKGROUND_OUTPUT_STREAM=${WEB_SCRAPER_BACKGROUND_OUTPUT_STREAM:-background:to.be.nlp}
      - FAILURE_OUTPUT_STREAM=${WEB_SCRAPER_FAILURE_OUTPUT_STREAM:-failure:to.be.scraped}
      - GROUP_NAME=${WEB_SCRAPER_GROUP_NAME:-default}
      - CONSUMER_NAME=${WEB_SCRAPER_CONSUMER_NAME:-web-scraper-1}
      - LOG_MODE=${WEB_SCRAPER_LOG_MODE:-10}
      - MAX_SCREENSHOT_FOLDER_SIZE=${WEB_SCRAPER_MAX_SCREENSHOT_FOLDER_SIZE:-10000000}
      - WARNING_NOTIFICATION_STREAM=${WARNING_NOTIFICATION_STREAM:-sentinel_warning_alerts}
      - CRITICAL_NOTIFICATION_STREAM=${CRITICAL_NOTIFICATION_STREAM:-sentinel_critical_alerts}
      # performance tuning
      - BATCH_SIZE=${WEB_SCRAPER_BATCH_SIZE:-10}
      - SCRAPER_MAX_WORKERS=${WEB_SCRAPER_MAX_WORKERS:-2}
      - MAX_PROXY_VALIDATION_WORKERS=${WEB_SCRAPER_MAX_PROXY_VALIDATION_WORKERS:-100}
      - MAX_FETCH_RETRIES=${WEB_SCRAPER_MAX_FETCH_RETRIES:-3}
      - INITIAL_FETCH_DELAY_S=${WEB_SCRAPER_INITIAL_FETCH_DELAY_S:-1}
      - FETCH_DELAY_GROWTH_RATE=${WEB_SCRAPER_FETCH_DELAY_GROWTH_RATE:-1.2}

    deploy:
      resources:
        limits:
          cpus: '${WEB_SCRAPER_CPU_LIMIT:-1.0}'
          memory: '${WEB_SCRAPER_MEMORY_LIMIT:-2G}'
        reservations:
          cpus: '${WEB_SCRAPER_CPU_RESERVATION:-0.5}'
          memory: '${WEB_SCRAPER_MEMORY_RESERVATION:-1G}'

  nlp-service:
    container_name: sentinel-nlp-service-container
    image: sentinel/nlp-service:latest
    build: 
      args:
        BASE_IMAGE: ${NLP_BASE:-sentinel/python-ml-cpu:3.12} 
      context: ../../
      dockerfile: ./microservices/nlp/Dockerfile
    shm_size: '${NLP_SHM_SIZE:-4gb}'

    depends_on:
      - postgres
      - redis

    profiles:
      - nlp

    volumes:
      - ${HOST_LOG_ROOT}/nlp/logs:/app/logs

    restart: unless-stopped
    networks:
      - sentinel-net

    <<: *common-env
    environment:
      - INPUT_STREAMS=${NLP_INPUT_STREAMS:-user:to.be.nlp, background:to.be.nlp}
      - USER_OUTPUT_STREAM=${NLP_USER_OUTPUT_STREAM:-user:to.be.retrieval}
      - BACKGROUND_OUTPUT_STREAM=${NLP_BACKGROUND_OUTPUT_STREAM:-background:to.be.retrieval}
      - FAILURE_OUTPUT_STREAM=${NLP_FAILURE_OUTPUT_STREAM:-failure:to.be.nlp}
      - GROUP_NAME=${NLP_GROUP_NAME:-default}
      - CONSUMER_NAME=${NLP_CONSUMER_NAME:-nlp-1}
      - WARNING_NOTIFICATION_STREAM=${WARNING_NOTIFICATION_STREAM:-sentinel_warning_alerts}
      - CRITICAL_NOTIFICATION_STREAM=${CRITICAL_NOTIFICATION_STREAM:-sentinel_critical_alerts}
      # performance tuning
      - BATCH_SIZE=${NLP_BATCH_SIZE:-10}
      - NLP_MAX_WORKERS=${NLP_MAX_WORKERS:-2}
      - NLP_EMBEDDING_MODEL=${NLP_EMBEDDING_MODEL}
      - NLP_NER_MODEL=${NLP_NER_MODEL}
      - NLP_BIAS_MODEL=${NLP_BIAS_MODEL}
      - USE_GPU=${USE_GPU}

    deploy:
      resources:
        limits:
          cpus: '${NLP_CPU_LIMIT:-1.0}'
          memory: '${NLP_MEMORY_LIMIT:-2G}'
        reservations:
          cpus: '${NLP_CPU_RESERVATION:-0.5}'
          memory: '${NLP_MEMORY_RESERVATION:-1G}'

  retrieval-layer-service:
    container_name: sentinel-retrieval-layer-service-container
    shm_size: '${RETRIEVAL_LAYER_SHM_SIZE:-2gb}'
    image: sentinel/retrieval-layer-service:latest
    build:
      args:
        BASE_IMAGE: ${RETRIEVAL_BASE:-sentinel/python-ml-cpu:3.12} 
      context: ../../
      dockerfile: ./microservices/retrieval_layer/Dockerfile

    depends_on:
      - postgres
      - redis

    profiles:
      - retrieval

    volumes:
      - ${HOST_LOG_ROOT}/retrieval/logs:/app/logs

    restart: unless-stopped
    networks:
      - sentinel-net

    <<: *common-env

    environment:
      - INPUT_STREAMS=${RETRIEVAL_INPUT_STREAMS:-user:to.be.retrieval}
      - FAILURE_OUTPUT_STREAM=${RETRIEVAL_FAILURE_OUTPUT_STREAM:-failure:to.be.retrieval}

      - GROUP_NAME=${RETRIEVAL_GROUP_NAME:-default}
      - CONSUMER_NAME=${RETRIEVAL_CONSUMER_NAME:-retrieval-layer-1}

      - DUMMY_NLP_MODE=${RETRIEVAL_DUMMY_NLP_MODE:-False}
      - DUMMY_SEED_MODE=${RETRIEVAL_DUMMY_SEED_MODE:-False}

      - POSTGRES_PORT=${POSTGRES_PORT:-5432}
      - POSTGRES_DB=${POSTGRES_DB:-sentinel}
      - POSTGRES_USER=${POSTGRES_USER:-sentinel}
      - POSTGRES_HOST=${POSTGRES_HOST:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-sentinelpass}

      - WARNING_NOTIFICATION_STREAM=${WARNING_NOTIFICATION_STREAM:-sentinel_warning_alerts}
      - CRITICAL_NOTIFICATION_STREAM=${CRITICAL_NOTIFICATION_STREAM:-sentinel_critical_alerts}
      
      - USE_GPU=${USE_GPU}

    deploy:
      resources:
        limits:
          cpus: '${RETRIEVAL_CPU_LIMIT:-0.5}'
          memory: '${RETRIEVAL_MEMORY_LIMIT:-2G}'
        reservations:
          cpus: '${RETRIEVAL_CPU_RESERVATION:-0.25}'
          memory: '${RETRIEVAL_MEMORY_RESERVATION:-1G}'

networks:
  sentinel-net:
    driver: bridge
